[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "coolapk-api"
version = "0.1.0"
description = "CoolApk API client with token capture from rooted Android via mitmproxy"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "lzy6739" }]
keywords = ["coolapk", "api", "mitmproxy", "android", "reverse-engineering"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
]

[project.scripts]
coolapk-api = "coolapk_api:main"

[project.urls]
Homepage = "https://github.com/lzy6739/coolapk-api"
